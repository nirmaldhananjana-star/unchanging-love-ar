

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unchanging Love AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: linear-gradient(135deg, #24102f, #70406f);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    #startScreen h1 {
      font-size: 30px;
    }

    #startButton {
      padding: 15px 35px;
      border: none;
      border-radius: 30px;
      background: #e9b5cf;
      color: #35162e;
      font-size: 18px;
      cursor: pointer;
    }

    #startScreen p {
      padding: 15px;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>Unchanging Love</h1>
    <p>A Story Beyond Time...</p>
    <button id="startButton">Start Experience ♥</button>
    <p>Scan the book cover to discover the story.</p>
  </div>

  <!-- Background Music -->
  <audio id="backgroundMusic"
    src="./music/background-music/background.mp3"
    loop
    preload="auto">
  </audio>

  <!-- Voice Over -->
  <audio id="voiceOver"
    src="./music/voice.mp3"
    preload="auto">
  </audio>

  <a-scene
    mindar-image="imageTargetSrc: ./ar-files/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="arVideo"
        src="./videos/animation.mp4"
        loop
        muted
        playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#arVideo"
        position="0 0 0"
        width="1"
        height="1.4">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    const startButton =
      document.getElementById("startButton");

    const startScreen =
      document.getElementById("startScreen");

    const backgroundMusic =
      document.getElementById("backgroundMusic");

    const voiceOver =
      document.getElementById("voiceOver");

    const arVideo =
      document.getElementById("arVideo");

    startButton.addEventListener("click", function () {

      startScreen.style.display = "none";

      backgroundMusic.volume = 0.90;
      voiceOver.volume = 1.0;

      backgroundMusic.play().catch(error => {
        console.error("Music Error:", error);
      });

      voiceOver.play().catch(error => {
        console.error("Voice Error:", error);
      });

    });

    const target = document.querySelector(
      '[mindar-image-target="targetIndex: 0"]'
    );

    target.addEventListener("targetFound", function () {
      arVideo.play().catch(console.error);
    });

    target.addEventListener("targetLost", function () {
      arVideo.pause();
    });

  </script>

</body>
</html>
